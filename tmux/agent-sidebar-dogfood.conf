# Personal skin for the tmux-agent-bar vertical sidebar (dogfood build).
# Source inside a -Ldogfood session AFTER the plugin's run-shell; overrides
# side-status-format with tmuxline-styled rows (same ranges — clicks work).
# Generated byte-safely (powerline chevrons are PUA chars; never retype).

set -g @agent_bar_position "left"
set -g @agent_bar_theme "nerdfont"
set -g status-style "bg=colour236,fg=colour254"
run-shell ~/dev/tmux-agent-bar/agent-bar.tmux

set -g side-status-format '#{S:#{?#{==:#{session_name},#{client_session}},#{W:#{?#{P:#{?#{@agent_state},x,}},#{?window_active,#[fg=colour254 bg=colour239]#[range=user|#{window_id}] #{window_name} #[norange]#[fg=colour239 bg=colour236]#[default],#[fg=colour254 bg=colour236]#[range=user|#{window_id}] #{window_name} #[norange]#[default]}#[nl]#{P:#{?#{@agent_state},  #[range=user|#{pane_id}]#{?#{==:#{@agent_state},needs-input},#[fg=yellow bold]?,#{?#{==:#{@agent_state},error},#[fg=red bold]!,#{?#{==:#{@agent_state},done},#[fg=green]+,#{?#{==:#{@agent_state},subagent-running},#[fg=cyan]**,#{?#{==:#{@agent_state},idle},#[fg=colour243]·,#[fg=cyan]*}}}}}#{?#{@agent_name}, #{=24:@agent_name},#{?#{@agent_app}, #{@agent_app},}}#[default]#[norange]#[nl],}},}},#{?#{W:#{P:#{?#{@agent_state},x,}}},#[fg=colour235 bg=colour109 bold]#[range=user|#{session_id}] #{session_name} #[norange]#[fg=colour109 bg=colour236 nobold]#[default]#[nl]#{W:#{?#{P:#{?#{@agent_state},x,}},#{?window_active,#[fg=colour254 bg=colour239]#[range=user|#{window_id}] #{window_name} #[norange]#[fg=colour239 bg=colour236]#[default],#[fg=colour254 bg=colour236]#[range=user|#{window_id}] #{window_name} #[norange]#[default]}#[nl]#{P:#{?#{@agent_state},  #[range=user|#{pane_id}]#{?#{==:#{@agent_state},needs-input},#[fg=yellow bold]?,#{?#{==:#{@agent_state},error},#[fg=red bold]!,#{?#{==:#{@agent_state},done},#[fg=green]+,#{?#{==:#{@agent_state},subagent-running},#[fg=cyan]**,#{?#{==:#{@agent_state},idle},#[fg=colour243]·,#[fg=cyan]*}}}}}#{?#{@agent_name}, #{=24:@agent_name},#{?#{@agent_app}, #{@agent_app},}}#[default]#[norange]#[nl],}},}},}}}'
